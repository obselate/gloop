name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Check release tag
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' gloop.gsproj)"
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{}")" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          rg -Fx '*.gs text eol=lf linguist-language=C#' .gitattributes
      - name: Install NativeAOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev binutils file ripgrep git python3
      - run: bash scripts/verify.sh
      - run: bash scripts/publish.sh Size
      - name: Package and verify release archive
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          check_dir="$(mktemp -d "$RUNNER_TEMP/gloop-package-check.XXXXXX")"
          tar -C artifacts/dist/Size -czf artifacts/release/gloop-linux-x64.tar.gz gloop
          (cd artifacts/release && sha256sum gloop-linux-x64.tar.gz > SHA256SUMS)
          (cd artifacts/release && sha256sum -c SHA256SUMS)
          test "$(tar -tzf artifacts/release/gloop-linux-x64.tar.gz)" = gloop
          tar -xzf artifacts/release/gloop-linux-x64.tar.gz -C "$check_dir"
          test "$(find "$check_dir" -maxdepth 1 -type f | wc -l)" -eq 1
          cmp artifacts/dist/Size/gloop "$check_dir/gloop"
          test -x "$check_dir/gloop"
          test "$("$check_dir/gloop" --version)" = "gloop ${GITHUB_REF_NAME#v}"
          test -n "$("$check_dir/gloop" --licenses)"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/gloop-release-notes.md"
          required_glibc="$(readelf --version-info artifacts/dist/Size/gloop | sed -nE 's/.*Name: GLIBC_([0-9]+\.[0-9]+).*/\1/p' | sort -Vu | tail -n 1)"
          test -n "$required_glibc"
          printf 'Linux x86-64 NativeAOT build. Requires glibc %s or newer, Wayland, and Vulkan.\n' "$required_glibc" > "$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            artifacts/release/gloop-linux-x64.tar.gz artifacts/release/SHA256SUMS \
            --draft --title "$GITHUB_REF_NAME" --notes-file "$notes_file" --verify-tag
